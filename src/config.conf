# Thermal Genie 配置（版本见 module.prop）
# 改完保存即可，守护进程每 10 秒自动重读，不需要重启
# 温度单位一律是「0.1℃」：350 = 35.0℃，480 = 48.0℃

# ===== 壳温诱骗（框架层不被限频）=====
SHELL_SPOOF=1
# trigger=只有电池够热才骗；always=一直骗（空闲会虚报更热）
SHELL_MODE=trigger
SHELL_TRIGGER=350
# 上报的壳温（37000 = 37.0℃）
SHELL_TEMP=37000

# ===== 充电降温解锁 =====
CHARGE_SPOOF=1
CHARGE_TRIGGER=300
# 自动 A/B：1=每次充电交替「保持 cool_down=0」和「不干预」，
#          每次充电都会在 logs/charging.log 里标记 ab=on / ab=off，
#          这样不用手动切换就能比较两种状态下的功率。
# 0=关闭（一直按 CHARGE_SPOOF 执行）
CHARGE_AB=0

# ===== 游戏帧率解锁（下次开机生效）=====
FPS_UNLOCK=1
RATE_UNLOCK=1
FPS_MAX=144

# ===== 安全护栏（两档）=====
# 与游戏统一：52.0℃ 停写，回落到 47.0℃ 恢复
GUARD_TRIGGER=520
GUARD_RELEASE=470
# 未充电（游戏）时：52.0℃ 才停写，回落到 47.0℃ 恢复
GUARD_TRIGGER_GAME=520
GUARD_RELEASE_GAME=470
# 触发瞬间至少上报这个值（毫摄氏度），或按 电池+偏移 取较大者
GUARD_VALUE_MIN=50000
GUARD_OFFSET=8000

# ===== 采集与运行参数 =====
# 自适应节拍：1=诱骗/充电时 5Hz，空闲时降到 1Hz（省电）；0=固定 TICK
ADAPTIVE=1
# 待机会话统计：1=熄屏开始计时、亮屏写一条汇总到 logs/standby.log
STANDBY=1
# 设备挂起超过这么多秒、醒来时又没看到「熄屏」那一刻，就按电量差补记一条（src=gap）
# 0=关闭补账；正常设备休眠一次通常几十秒起，90 不会被误触发
SB_GAP_MIN=90
# 充电采样间隔（fast 模式下每 N 个 tick 一个功率点，5 = 1 秒）
CHARGE_SAMPLE=5
# 常规遥测间隔：每 25 个 TICK 写一行（约 5 秒）
TELEMETRY=1
TICK=0.2
# ===== 温度墙解锁（默认关闭）=====
# 1=开机时把 CPU 结温 trip 点抬高 THERMAL_DELTA（单位：毫摄氏度）
# 只动 cpu-* 和 sys-therm-* 两类，永不超过 THERMAL_CAP
# 写入的是 sysfs，重启即恢复原值
THERMAL_UNLOCK=0
THERMAL_DELTA=5000
THERMAL_CAP=98000
# ===== 冷却设备直控（默认关闭，激进）=====
# 1=电池温度低于 CDEV_GUARD 时，把 cpu-cluster* 冷却设备的 cur_state 钉在 0
# 作用：绕过内核的 CPU 降频（内核在 ~88-92℃ 就会压频，这不走 sysfs trip）
# CDEV_GUARD：电池温度护栏（0.1℃，520 = 52.0℃），到这个温度就交回系统
CDEV_UNLOCK=0
CDEV_GUARD=520
